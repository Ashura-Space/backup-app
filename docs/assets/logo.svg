<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Backup App">
  <!--
    Uygulamanin ikonuyla ayni cizim: arkada ince cerceveli bir kart, onunde
    dolu beyaz bir kart ve icinde mavi bir onay. Bir seyin ikinci bir kopyasi
    var ve o kopya tamam.

    Duz renk, tek isaret, gradyan yok: 16 piksele indiginde de ayakta kalsin.
  -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="#2563eb"/>
  <rect x="24" y="20" width="44" height="44" rx="10"
        fill="none" stroke="#ffffff" stroke-opacity="0.59" stroke-width="6" stroke-linejoin="round"/>
  <rect x="34" y="34" width="46" height="46" rx="11" fill="#ffffff"/>
  <polyline points="45,57 54,66 70,47"
            fill="none" stroke="#2563eb" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
